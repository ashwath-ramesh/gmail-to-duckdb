name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build:
    needs: govulncheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Install MinGW
        if: runner.os == 'Windows'
        run: choco install mingw -y
      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: 1
        run: go build -trimpath -ldflags="-s -w" -o gmail-to-duckdb${{ matrix.ext }} ./cmd/gmail-to-duckdb
      - name: Smoke test
        shell: bash
        run: ./gmail-to-duckdb${{ matrix.ext }} --help
      - name: Record Go version
        shell: bash
        run: |
          go version
          go version -m "gmail-to-duckdb${{ matrix.ext }}"
      - name: Archive
        shell: bash
        run: |
          name="gmail-to-duckdb-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            archive="${name}.zip"
            7z a "$archive" gmail-to-duckdb.exe
          else
            archive="${name}.tar.gz"
            tar -czf "$archive" gmail-to-duckdb
          fi
          sha256sum "$archive" > "${archive}.sha256"
          ls -l "$archive" "${archive}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gmail-to-duckdb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            gmail-to-duckdb-*.tar.gz
            gmail-to-duckdb-*.tar.gz.sha256
            gmail-to-duckdb-*.zip
            gmail-to-duckdb-*.zip.sha256

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/**
          generate_release_notes: true
