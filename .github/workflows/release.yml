name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests already run test.yml by itself.
  test:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test.yml

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin the Linux images. The glibc of the build image sets the oldest
          # glibc that the binary can run on (see MAX_GLIBC below).
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          # The last Intel macOS image; GitHub supports it until fall 2027.
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
    runs-on: ${{ matrix.os }}
    env:
      # The oldest macOS that the binary runs on. Without it, clang targets the
      # macOS version of the build image. Go 1.26 needs macOS 12.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      # The newest glibc symbol version that the Linux binary may need.
      # 2.38: Ubuntu 24.04, Debian 13, Fedora 39, and later.
      MAX_GLIBC: "2.38"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # Build release files from a clean cache. The Go cache key does not
          # include MACOSX_DEPLOYMENT_TARGET.
          cache: false
      - name: Install MinGW
        if: runner.os == 'Windows'
        # Pin the C compiler that builds the Windows release binary.
        # Bump this version on purpose, not by whatever Chocolatey serves today.
        run: choco install mingw --version=16.2.0 --no-progress -y
      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: 1
        run: go build -trimpath -ldflags="-s -w" -o gmail-to-duckdb${{ matrix.ext }} ./cmd/gmail-to-duckdb
      - name: Smoke test
        shell: bash
        run: ./gmail-to-duckdb${{ matrix.ext }} --help
      - name: Check oldest supported OS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin=gmail-to-duckdb
          if [ "$RUNNER_OS" = "Linux" ]; then
            need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "needs glibc $need (limit $MAX_GLIBC)"
            if [ "$(printf '%s\n%s\n' "$need" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
              echo "::error::the binary needs glibc $need, newer than $MAX_GLIBC"
              exit 1
            fi
          else
            need=$(otool -l "$bin" | awk '$1 == "minos" { print $2; exit }')
            echo "needs macOS $need (target $MACOSX_DEPLOYMENT_TARGET)"
            if [ "$need" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              echo "::error::the binary needs macOS $need, not $MACOSX_DEPLOYMENT_TARGET"
              exit 1
            fi
          fi
      - name: Record Go version
        shell: bash
        run: |
          go version
          go version -m "gmail-to-duckdb${{ matrix.ext }}"
      - name: Archive
        shell: bash
        run: |
          name="gmail-to-duckdb-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            archive="${name}.zip"
            7z a "$archive" gmail-to-duckdb.exe
          else
            archive="${name}.tar.gz"
            tar -czf "$archive" gmail-to-duckdb
          fi
          sha256sum "$archive" > "${archive}.sha256"
          ls -l "$archive" "${archive}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gmail-to-duckdb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            gmail-to-duckdb-*.tar.gz
            gmail-to-duckdb-*.tar.gz.sha256
            gmail-to-duckdb-*.zip
            gmail-to-duckdb-*.zip.sha256

  release:
    needs: [test, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sign build provenance for each archive (Sigstore, through GitHub).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/**
          generate_release_notes: false
