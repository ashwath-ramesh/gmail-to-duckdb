name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install MinGW
        if: runner.os == 'Windows'
        run: choco install mingw -y
      - name: Build
        env:
          CGO_ENABLED: 1
        run: go build -trimpath -ldflags="-s -w" -o gmail-to-duckdb${{ matrix.ext }} ./cmd/gmail-to-duckdb
      - name: Archive
        shell: bash
        run: |
          name="gmail-to-duckdb-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "${name}.zip" gmail-to-duckdb.exe
          else
            tar -czf "${name}.tar.gz" gmail-to-duckdb
          fi
          ls -l gmail-to-duckdb-*
      - uses: actions/upload-artifact@v4
        with:
          name: gmail-to-duckdb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            gmail-to-duckdb-*.tar.gz
            gmail-to-duckdb-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
