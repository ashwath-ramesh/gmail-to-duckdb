<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Gmail to DuckDB</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>Gmail to DuckDB</h1>
    <nav>
      <button type="button" id="tab-mail" class="active">Mail</button>
      <button type="button" id="tab-stats">Stats</button>
    </nav>
  </header>
  <main>
    <section id="mail">
      <form id="filters">
        <input name="q" placeholder="Search mail" autocomplete="off">
        <label class="chip"><input type="checkbox" name="unread"> Unread</label>
      </form>
      <p class="hint">from: to: subject: unread after:2024-01-01</p>
      <div class="layout">
        <div class="list-pane">
          <div id="list"></div>
          <button type="button" id="more" hidden>More</button>
        </div>
        <article id="detail"><p>Select a message.</p></article>
      </div>
    </section>
    <section id="stats" hidden>
      <p class="hint">Preloaded SQL. Ad-hoc queries open in the DuckDB UI.</p>
      <p><button type="button" id="duck-ui">Open DuckDB UI</button></p>
      <div id="cards"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
